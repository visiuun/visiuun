name: Refresh profile cards

# Re-renders assets/readme/*.svg so stars, repo counts, languages and
# "New" badges stay current. Commits only when something changed.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/readme/**", ".github/workflows/readme.yml"]

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli pillow
      - run: python .github/readme/generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git add assets/readme
          if git diff --cached --quiet; then
            echo "Cards unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile cards"
          git push
